[package]
name = "liteparse"
version = "0.1.0"
edition = "2024"

[dependencies]
aether_communication = { path = "../../../facets/communication" }
aether_ocr = { path = "../../../facets/ocr" }
async-trait.workspace = true
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
aether_communication = { path = "../../../facets/communication", features = ["testing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
