[package]
name = "jmap"
version = "0.1.0"
edition = "2024"

[dependencies]
aether_communication = { path = "../../../facets/communication" }
async-trait.workspace = true
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
