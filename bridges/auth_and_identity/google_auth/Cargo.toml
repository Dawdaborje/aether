[package]
name = "google_auth"
version = "0.1.0"
edition = "2024"

[dependencies]
aether_auth_bridge = { path = "../auth_bridge" }
async-trait = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "form",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
url = "2"
