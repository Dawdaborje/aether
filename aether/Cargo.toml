[package]
name = "aether"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.6", features = ["env", "derive", "string"] }
log = "0.4"
env_logger = "0.11"
surrealdb.workspace = true
thiserror = "2.0.20"
colored = "3"
# Aether modules
aether_core = { path = "../facets/core" }
aether_orm = { path = "../facets/orm" }
aether_authentication = { path = "../facets/authentication" }
include_dir = "0.7.4"
directories = "6.0.0"
