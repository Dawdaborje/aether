[package]
name = "aether_sfu"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
