[package]
name = "aether_core_api"
version = "0.1.0"
edition = "2024"

[features]
# JSON Schemas of plugin.toml, models and rules (used by `aether --mcp`).
schemars = ["dep:schemars", "aether_core/schemars"]

[dependencies]
schemars = { version = "1", optional = true }
aether_core = { path = "../core" }
aether_core_base = { path = "../core_base" }
aether_ai = { path = "../ai" }
aether_orm = { path = "../orm" }
aether_localization = { path = "../localization" }
aether_web = { path = "../web" }
aether_docs = { path = "../docs" }
aether_communication = { path = "../communication" }
aether_storage = { path = "../storage" }
collabora = { path = "../../bridges/document_management/collabora" }
axum.workspace = true
futures.workspace = true
async-trait.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
surrealdb.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
log = "0.4.33"
chrono = "0.4"
base64 = "0.22"
rand = "0.10"
time = "0.3"
