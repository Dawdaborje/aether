[package]
name = "aether_core_base"
version = "0.1.0"
edition = "2024"

[features]
# JSON Schemas of models and rules (used by `aether --mcp`).
schemars = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
aether_orm = { path = "../orm" }
aether_communication = { path = "../communication" }
aether_storage = { path = "../storage" }
aether_sfu = { path = "../sfu" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
surrealdb.workspace = true
moka.workspace = true
sha2.workspace = true
rand = "0.10"
flate2 = "1"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["full"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = "0.4"
ed25519-dalek = "2"
quick-xml.workspace = true
ammonia = "4"
zip = { version = "2", default-features = false, features = ["deflate"] }
croner = "2"
chrono-tz = "0.10"
bytes.workspace = true
axum.workspace = true
aes-gcm = "0.10"
redis = { version = "1.6", default-features = true }
log = "0.4.33"
directories = "6.0.0"
async-trait.workspace = true
futures.workspace = true
url = "2"
hmac = "0.13"
time = "0.3"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
object_store.workspace = true
