[package]
name = "aether_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# facets
aether_organization = { path = "../organization" }
aether_orm = { path = "../orm" }
aether_security = { path = "../security" }
aether_web = { path = "../web" }
aether_event_bus = { path = "../event_bus" }
# deps
extism.workspace = true
axum.workspace = true
axum-extra.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
quick-xml.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
thiserror = "2.0.20"
log = "0.4.33"
directories = "6.0.0"
redis = { version = "1.6", default-features = true }
moka.workspace = true
surrealdb.workspace = true

[dev-dependencies]
tempfile = "3"
