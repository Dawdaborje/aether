[package]
name = "aether_payroll"
version = "0.1.0"
edition = "2024"
description = "Payroll calculation in the kernel: the Swift payroll engine, run natively on every core for plugins (`payroll::calculate`)."

[dependencies]
# Default features off: `exact-json` would turn on serde_json's `arbitrary_precision` for the whole kernel.
sp_engine = { git = "https://github.com/Dawdaborje/swift_payroll_engine", default-features = false, features = ["parallel"] }
rayon = "1"
serde_json = "1"
